name: medibook
description: Multi-clinic medical appointment & telehealth platform.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_bloc: ^8.1.6
  bloc: ^8.1.4
  equatable: ^2.0.5
  get_it: ^7.7.0
  go_router: ^14.2.7
  dio: ^5.7.0
  connectivity_plus: ^6.0.5
  flutter_secure_storage: ^9.2.2
  hive_ce: ^2.8.1
  hive_ce_flutter: ^2.1.0
  path_provider: ^2.1.4
  local_auth: ^2.3.0
  crypto: ^3.0.5
  intl: ^0.19.0
  logging: ^1.2.0
  uuid: ^4.5.1
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  bloc_test: ^9.1.7
  mocktail: ^1.0.4
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/fonts/
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Variable.ttf
