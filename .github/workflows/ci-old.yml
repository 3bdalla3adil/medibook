name: ci

on:
  pull_request:
  push:
    branches: [main]

env:
  FLUTTER_VERSION: '3.24.5'

jobs:
  analyze_and_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: flutter analyze --fatal-infos --fatal-warnings
      - run: flutter test --coverage
      - name: Layer boundary guardrail
        run: |
          violations=$(grep -rn --include="*.dart" \
            -E "package:(dio|hive_ce|hive_ce_flutter|flutter_secure_storage)/" \
            lib/features/*/presentation lib/features/*/domain lib/app lib/core/widgets \
            || true)
          if [ -n "$violations" ]; then
            echo "::error::Forbidden imports in presentation/domain layers:"
            echo "$violations"
            exit 1
          fi
