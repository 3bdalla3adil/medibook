name: CI

on:
  push:
    branches: [main]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_production:
        description: 'Build production artifacts'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  ORG: com.medibook
  APP: medibook

jobs:
  analyze-and-test:
    name: Analyze and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate Localizations
        run: |
          if [ -f l10n.yaml ]; then
            flutter gen-l10n
          fi

      - name: Static Analysis
        run: flutter analyze --fatal-warnings

      - name: Unit and Widget Tests
        run: flutter test --coverage

      - name: Layer Boundary Guardrail
        run: |
          violations=$(grep -rn --include="*.dart"             -E "package:(dio|hive_ce|hive_ce_flutter|flutter_secure_storage|isar|isar_flutter_libs)/"             lib/features/*/presentation lib/features/*/domain lib/app lib/core/widgets             || true)
          if [ -n "$violations" ]; then
            echo "::error::Forbidden infrastructure imports in presentation/domain layers:"
            echo "$violations"
            exit 1
          fi

      - name: No hardcoded user-facing strings
        run: |
          hits=$(grep -rn --include="*.dart" -E "(Text|TextSpan)\(\s*['\"][A-Z]" lib/features/*/presentation || true)
          if [ -n "$hits" ]; then
            echo "::error::Hardcoded user-facing strings found:"
            echo "$hits"
            exit 1
          fi

      - name: Upload Coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 7

  integration-demo:
    name: Demo Login Integration (Staging)
    needs: analyze-and-test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: staging
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare Android platform
        run: flutter create --platforms=android --org "$ORG" --project-name "$APP" .

      - name: Set Android compile SDK for Daily/Firebase plugins
        run: |
          sed -i -E 's/^[[:space:]]*compileSdk = .*/    compileSdk = 36/' android/app/build.gradle.kts
          grep -n "compileSdk" android/app/build.gradle.kts

      - name: Install Dependencies
        run: flutter pub get

      - name: Install Firebase CLI and FlutterFire CLI
        run: |
          npm install --global firebase-tools
          dart pub global activate flutterfire_cli
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Configure Firebase for CI
        env:
          FIREBASE_TOKEN: ${{ secrets.STAGING_FIREBASE_TOKEN }}
          FIREBASE_PROJECT_ID: ${{ secrets.STAGING_FIREBASE_PROJECT_ID }}
        run: |
          test -n "$FIREBASE_TOKEN" || { echo "::error::STAGING_FIREBASE_TOKEN is required in the staging environment."; exit 1; }
          test -n "$FIREBASE_PROJECT_ID" || { echo "::error::STAGING_FIREBASE_PROJECT_ID is required in the staging environment."; exit 1; }
          flutterfire configure --project="$FIREBASE_PROJECT_ID" --platforms=android --yes
          test -f lib/firebase_options.dart
          test -f android/app/google-services.json

      - name: Inject Staging Configuration
        env:
          DART_DEFINE_JSON: ${{ secrets.STAGING_DART_DEFINE_JSON }}
        run: |
          test -n "$DART_DEFINE_JSON" || {
            echo "::error::STAGING_DART_DEFINE_JSON is required in the staging environment."
            exit 1
          }
          mkdir -p config
          printf '%s' "$DART_DEFINE_JSON" > config/staging.json

      - name: Generate Localizations
        run: |
          if [ -f l10n.yaml ]; then flutter gen-l10n; fi

      - name: Run demo login flow on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          force-avd-creation: true
          script: |
            adb wait-for-device
            adb shell getprop sys.boot_completed | grep -m 1 '1'
            flutter test integration_test/demo_login_flow_test.dart --dart-define-from-file=config/staging.json

  build-staging-apk:
    name: Build Staging APK
    needs: analyze-and-test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Regenerate Android platform scaffolding
        run: flutter create --platforms=android --org "$ORG" --project-name "$APP" .

      - name: Set Android compile SDK for Daily/Firebase plugins
        run: |
          sed -i -E 's/^[[:space:]]*compileSdk = .*/    compileSdk = 36/' android/app/build.gradle.kts

      - name: Install Dependencies
        run: flutter pub get

      - name: Install Firebase CLI and FlutterFire CLI
        run: |
          npm install --global firebase-tools
          dart pub global activate flutterfire_cli
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Configure Firebase for CI
        env:
          FIREBASE_TOKEN: ${{ secrets.STAGING_FIREBASE_TOKEN }}
          FIREBASE_PROJECT_ID: ${{ secrets.STAGING_FIREBASE_PROJECT_ID }}
        run: |
          test -n "$FIREBASE_TOKEN" || { echo "::error::STAGING_FIREBASE_TOKEN is required in the staging environment."; exit 1; }
          test -n "$FIREBASE_PROJECT_ID" || { echo "::error::STAGING_FIREBASE_PROJECT_ID is required in the staging environment."; exit 1; }
          flutterfire configure --project="$FIREBASE_PROJECT_ID" --platforms=android --yes
          test -f lib/firebase_options.dart
          test -f android/app/google-services.json

      - name: Inject Staging Configuration
        env:
          DART_DEFINE_JSON: ${{ secrets.STAGING_DART_DEFINE_JSON }}
        run: |
          test -n "$DART_DEFINE_JSON" || {
            echo "::error::STAGING_DART_DEFINE_JSON is required in the staging environment."
            exit 1
          }
          mkdir -p config
          printf '%s' "$DART_DEFINE_JSON" > config/staging.json

      - name: Validate Staging Configuration
        run: |
          python3 - <<'PY'
          import json
          with open("config/staging.json", encoding="utf-8") as f:
              c = json.load(f)
          required = {
              "APP_ENV": "staging",
              "ENABLE_DEMO_AUTH": "true",
              "ALLOW_CLEARTEXT": "false",
              "ENABLE_SSL_PINNING": "true",
          }
          for key, value in required.items():
              actual = str(c.get(key, "")).lower()
              if actual != value:
                  raise SystemExit(f"{key} must be {value}, got {actual!r}")
          url = str(c.get("API_BASE_URL", ""))
          if not url.startswith("https://") or "example.com" in url:
              raise SystemExit("Staging API_BASE_URL must be a real HTTPS endpoint.")
          print("Staging configuration validated.")
          PY

      - name: Generate Localizations
        run: |
          if [ -f l10n.yaml ]; then flutter gen-l10n; fi

      - name: Build Staging APK
        run: flutter build apk --release --dart-define-from-file=config/staging.json

      - name: Verify Staging APK
        run: test -f build/app/outputs/flutter-apk/app-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: medibook-staging-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Install Firebase CLI for App Distribution
        if: env.FIREBASE_APP_ID != '' && env.FIREBASE_TOKEN != ''
        run: npm install --global firebase-tools

      - name: Upload staging APK to Firebase App Distribution
        if: env.FIREBASE_APP_ID != '' && env.FIREBASE_TOKEN != ''
        env:
          FIREBASE_TOKEN: ${{ secrets.STAGING_FIREBASE_TOKEN }}
          FIREBASE_APP_ID: ${{ secrets.STAGING_FIREBASE_APP_ID }}
        run: |
          firebase appdistribution:distribute build/app/outputs/flutter-apk/app-release.apk             --app "$FIREBASE_APP_ID"             --release-notes "MediBook staging build $GITHUB_SHA"

  build-staging-ipa:
    name: Build Staging Unsigned IPA
    needs: analyze-and-test
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    environment: staging
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Regenerate iOS platform scaffolding
        run: flutter create --platforms=ios --org "$ORG" --project-name "$APP" .

      - name: Install Dependencies
        run: flutter pub get

      - name: Install Firebase CLI and FlutterFire CLI
        run: |
          npm install --global firebase-tools
          dart pub global activate flutterfire_cli
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Configure Firebase for CI
        env:
          FIREBASE_TOKEN: ${{ secrets.STAGING_FIREBASE_TOKEN }}
          FIREBASE_PROJECT_ID: ${{ secrets.STAGING_FIREBASE_PROJECT_ID }}
        run: |
          test -n "$FIREBASE_TOKEN" || { echo "::error::STAGING_FIREBASE_TOKEN is required in the staging environment."; exit 1; }
          test -n "$FIREBASE_PROJECT_ID" || { echo "::error::STAGING_FIREBASE_PROJECT_ID is required in the staging environment."; exit 1; }
          flutterfire configure --project="$FIREBASE_PROJECT_ID" --platforms=ios --yes
          test -f lib/firebase_options.dart
          test -f ios/Runner/GoogleService-Info.plist

      - name: Inject Staging Configuration
        env:
          DART_DEFINE_JSON: ${{ secrets.STAGING_DART_DEFINE_JSON }}
        run: |
          test -n "$DART_DEFINE_JSON" || {
            echo "::error::STAGING_DART_DEFINE_JSON is required in the staging environment."
            exit 1
          }
          mkdir -p config
          printf '%s' "$DART_DEFINE_JSON" > config/staging.json

      - name: Validate Staging Configuration
        run: |
          python3 - <<'PY'
          import json
          with open("config/staging.json", encoding="utf-8") as f:
              c = json.load(f)
          required = {
              "APP_ENV": "staging",
              "ENABLE_DEMO_AUTH": "true",
              "ALLOW_CLEARTEXT": "false",
          }
          for key, value in required.items():
              actual = str(c.get(key, "")).lower()
              if actual != value:
                  raise SystemExit(f"{key} must be {value}, got {actual!r}")
          url = str(c.get("API_BASE_URL", ""))
          if not url.startswith("https://") or "example.com" in url:
              raise SystemExit("Staging API_BASE_URL must be a real HTTPS endpoint.")
          print("Staging configuration validated.")
          PY

      - name: Generate Localizations
        run: |
          if [ -f l10n.yaml ]; then flutter gen-l10n; fi

      - name: Build Staging iOS without Codesign
        run: flutter build ios --release --no-codesign --dart-define-from-file=config/staging.json

      - name: Package Staging Unsigned IPA
        run: |
          rm -rf Payload medibook-staging-unsigned.ipa
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -r -X -q medibook-staging-unsigned.ipa Payload
          test -f medibook-staging-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: medibook-staging-ipa-unsigned
          path: medibook-staging-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

  build-production-apk:
    name: Build Production APK
    needs: analyze-and-test
    if: >
      github.event_name == 'workflow_dispatch' && inputs.build_production == true
      || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Regenerate Android platform scaffolding
        run: flutter create --platforms=android --org "$ORG" --project-name "$APP" .

      - name: Set Android compile SDK for Daily/Firebase plugins
        run: |
          sed -i -E 's/^[[:space:]]*compileSdk = .*/    compileSdk = 36/' android/app/build.gradle.kts

      - name: Install Dependencies
        run: flutter pub get

      - name: Install Firebase CLI and FlutterFire CLI
        run: |
          npm install --global firebase-tools
          dart pub global activate flutterfire_cli
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Configure Firebase for CI
        env:
          FIREBASE_TOKEN: ${{ secrets.PRODUCTION_FIREBASE_TOKEN }}
          FIREBASE_PROJECT_ID: ${{ secrets.PRODUCTION_FIREBASE_PROJECT_ID }}
        run: |
          test -n "$FIREBASE_TOKEN" || { echo "::error::PRODUCTION_FIREBASE_TOKEN is required in the production environment."; exit 1; }
          test -n "$FIREBASE_PROJECT_ID" || { echo "::error::PRODUCTION_FIREBASE_PROJECT_ID is required in the production environment."; exit 1; }
          flutterfire configure --project="$FIREBASE_PROJECT_ID" --platforms=android --yes
          test -f lib/firebase_options.dart
          test -f android/app/google-services.json

      - name: Inject Production Configuration
        env:
          DART_DEFINE_JSON: ${{ secrets.PRODUCTION_DART_DEFINE_JSON }}
        run: |
          test -n "$DART_DEFINE_JSON" || {
            echo "::error::PRODUCTION_DART_DEFINE_JSON is required in the production environment."
            exit 1
          }
          mkdir -p config
          printf '%s' "$DART_DEFINE_JSON" > config/production.json

      - name: Validate Production Configuration
        run: |
          python3 - <<'PY'
          import json
          with open("config/production.json", encoding="utf-8") as f:
              c = json.load(f)
          required = {
              "APP_ENV": "prod",
              "ENABLE_DEMO_AUTH": "false",
              "ALLOW_CLEARTEXT": "false",
          }
          for key, value in required.items():
              actual = str(c.get(key, "")).lower()
              if actual != value:
                  raise SystemExit(f"{key} must be {value}, got {actual!r}")
          url = str(c.get("API_BASE_URL", ""))
          if not url.startswith("https://") or "example.com" in url:
              raise SystemExit("Production API_BASE_URL must be a real HTTPS endpoint.")
          if not c.get("CERTIFICATE_SHA256"):
              raise SystemExit("Production CERTIFICATE_SHA256 is required.")
          print("Production configuration validated.")
          PY

      - name: Generate Localizations
        run: |
          if [ -f l10n.yaml ]; then flutter gen-l10n; fi

      - name: Build Production APK
        run: flutter build apk --release --dart-define-from-file=config/production.json

      - name: Verify Production APK
        run: test -f build/app/outputs/flutter-apk/app-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: medibook-production-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Install Firebase CLI for App Distribution
        if: env.FIREBASE_APP_ID != '' && env.FIREBASE_TOKEN != ''
        run: npm install --global firebase-tools

      - name: Upload production APK to Firebase App Distribution
        if: env.FIREBASE_APP_ID != '' && env.FIREBASE_TOKEN != ''
        env:
          FIREBASE_TOKEN: ${{ secrets.PRODUCTION_FIREBASE_TOKEN }}
          FIREBASE_APP_ID: ${{ secrets.PRODUCTION_FIREBASE_APP_ID }}
        run: |
          firebase appdistribution:distribute build/app/outputs/flutter-apk/app-release.apk             --app "$FIREBASE_APP_ID"             --release-notes "MediBook production build $GITHUB_SHA"

  build-production-ipa:
    name: Build Production Unsigned IPA
    needs: analyze-and-test
    if: >
      github.event_name == 'workflow_dispatch' && inputs.build_production == true
      || startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    environment: production
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Regenerate iOS platform scaffolding
        run: flutter create --platforms=ios --org "$ORG" --project-name "$APP" .

      - name: Install Dependencies
        run: flutter pub get

      - name: Install Firebase CLI and FlutterFire CLI
        run: |
          npm install --global firebase-tools
          dart pub global activate flutterfire_cli
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Configure Firebase for CI
        env:
          FIREBASE_TOKEN: ${{ secrets.PRODUCTION_FIREBASE_TOKEN }}
          FIREBASE_PROJECT_ID: ${{ secrets.PRODUCTION_FIREBASE_PROJECT_ID }}
        run: |
          test -n "$FIREBASE_TOKEN" || { echo "::error::PRODUCTION_FIREBASE_TOKEN is required in the production environment."; exit 1; }
          test -n "$FIREBASE_PROJECT_ID" || { echo "::error::PRODUCTION_FIREBASE_PROJECT_ID is required in the production environment."; exit 1; }
          flutterfire configure --project="$FIREBASE_PROJECT_ID" --platforms=ios --yes
          test -f lib/firebase_options.dart
          test -f ios/Runner/GoogleService-Info.plist

      - name: Inject Production Configuration
        env:
          DART_DEFINE_JSON: ${{ secrets.PRODUCTION_DART_DEFINE_JSON }}
        run: |
          test -n "$DART_DEFINE_JSON" || {
            echo "::error::PRODUCTION_DART_DEFINE_JSON is required in the production environment."
            exit 1
          }
          mkdir -p config
          printf '%s' "$DART_DEFINE_JSON" > config/production.json

      - name: Validate Production Configuration
        run: |
          python3 - <<'PY'
          import json
          with open("config/production.json", encoding="utf-8") as f:
              c = json.load(f)
          required = {
              "APP_ENV": "prod",
              "ENABLE_DEMO_AUTH": "false",
              "ALLOW_CLEARTEXT": "false",
          }
          for key, value in required.items():
              actual = str(c.get(key, "")).lower()
              if actual != value:
                  raise SystemExit(f"{key} must be {value}, got {actual!r}")
          url = str(c.get("API_BASE_URL", ""))
          if not url.startswith("https://") or "example.com" in url:
              raise SystemExit("Production API_BASE_URL must be a real HTTPS endpoint.")
          if not c.get("CERTIFICATE_SHA256"):
              raise SystemExit("Production CERTIFICATE_SHA256 is required.")
          print("Production configuration validated.")
          PY

      - name: Generate Localizations
        run: |
          if [ -f l10n.yaml ]; then flutter gen-l10n; fi

      - name: Build Production iOS without Codesign
        run: flutter build ios --release --no-codesign --dart-define-from-file=config/production.json

      - name: Package Production Unsigned IPA
        run: |
          rm -rf Payload medibook-production-unsigned.ipa
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -r -X -q medibook-production-unsigned.ipa Payload
          test -f medibook-production-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: medibook-production-ipa-unsigned
          path: medibook-production-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
