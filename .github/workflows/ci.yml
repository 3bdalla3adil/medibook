name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  ORG: com.medibook
  APP: medibook

jobs:
  analyze-and-test:
    name: Analyze and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:" # Enhanced persistent caching structure
          
      - name: Install Dependencies
        run: flutter pub get

      # Resolves local l10n compilation generation constraints safely if files are missing or initializing
      - name: Generate Localizations
        run: |
          if [ -f l10n.yaml ]; then
            flutter gen-l10n
          else
            echo "Skipping gen-l10n: No l10n.yaml file declared yet."
          fi

      - name: Static Analysis
        run: flutter analyze --fatal-warnings

      - name: Unit and Widget Tests
        run: flutter test --coverage

      - name: Layer Boundary Guardrail
        run: |
          violations=$(grep -rn --include="*.dart" \
            -E "package:(dio|hive_ce|hive_ce_flutter|flutter_secure_storage|isar|isar_flutter_libs)/" \
            lib/features/*/presentation lib/features/*/domain lib/app lib/core/widgets \
            || true)
          if [ -n "$violations" ]; then
            echo "::error::Forbidden infrastructure imports in presentation/domain layers:"
            echo "$violations"
            exit 1
          fi

      - name: Upload Coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 7

  build-apk:
    name: Build Release APK
    needs: analyze-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'
          
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Regenerate Android platform scaffolding
        run: flutter create --platforms=android --org "$ORG" --project-name "$APP" .

      - name: Install Dependencies
        run: flutter pub get

      # Security & Pipeline Hardening: Generates missing staging configuration securely to avoid build failures
      - name: Inject Secure Staging Configuration
        run: |
          mkdir -p config
          if [ -n "${{ secrets.STAGING_DART_DEFINE_JSON }}" ]; then
            echo '${{ secrets.STAGING_DART_DEFINE_JSON }}' > config/staging.json
          else
            echo '{"API_BASE_URL": "https://medibook.com", "ENCRYPTION_KEY_FALLBACK": "CI_STUB"}' > config/staging.json
          fi

      - name: Generate Localizations
        run: |
          if [ -f l10n.yaml ]; then flutter gen-l10n; fi

      - name: Build Release APK
        run: flutter build apk --release --dart-define-from-file=config/staging.json

      - name: Verify APK
        run: test -f build/app/outputs/flutter-apk/app-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: medibook-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

  build-ipa:
    name: Build Unsigned IPA
    needs: analyze-and-test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          
      - name: Regenerate iOS platform scaffolding
        run: flutter create --platforms=ios --org "$ORG" --project-name "$APP" .

      - name: Install Dependencies
        run: flutter pub get

      # Re-generate configuration inside isolated macOS runner matching structural target paths
      - name: Inject Secure Staging Configuration
        run: |
          mkdir -p config
          if [ -n "${{ secrets.STAGING_DART_DEFINE_JSON }}" ]; then
            echo '${{ secrets.STAGING_DART_DEFINE_JSON }}' > config/staging.json
          else
            echo '{"API_BASE_URL": "https://medibook.com", "ENCRYPTION_KEY_FALLBACK": "CI_STUB"}' > config/staging.json
          fi

      - name: Generate Localizations
        run: |
          if [ -f l10n.yaml ]; then flutter gen-l10n; fi

      - name: Build iOS without Codesign
        run: flutter build ios --release --no-codesign --dart-define-from-file=config/staging.json

      - name: Package Unsigned IPA
        run: |
          rm -rf Payload app-release-unsigned.ipa
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -r -X -q app-release-unsigned.ipa Payload
          test -f app-release-unsigned.ipa
          
      - uses: actions/upload-artifact@v4
        with:
          name: medibook-release-ipa-unsigned
          path: app-release-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
