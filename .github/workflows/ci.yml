name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  ORG: com.medibook
  APP: medibook

jobs:
  analyze-and-test:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Generate localizations
        run: flutter gen-l10n
      - name: Static analysis
        run: flutter analyze --fatal-warnings
      - name: Unit and widget tests
        run: flutter test --coverage
      - name: Layer boundary guardrail
        run: |
          violations=$(grep -rn --include="*.dart" \
            -E "package:(dio|hive_ce|hive_ce_flutter|flutter_secure_storage)/" \
            lib/features/*/presentation lib/features/*/domain lib/app lib/core/widgets \
            || true)
          if [ -n "$violations" ]; then
            echo "::error::Forbidden infrastructure imports in presentation/domain layers:"
            echo "$violations"
            exit 1
          fi
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 7

  build-apk:
    name: Build release APK
    needs: analyze-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      - name: Build release APK
        run: flutter build apk --release --dart-define-from-file=config/staging.json
      - name: Verify APK
        run: test -f build/app/outputs/flutter-apk/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: medibook-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

  build-ipa:
    name: Build unsigned IPA
    needs: analyze-and-test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      - name: Build iOS without codesign
        run: flutter build ios --release --no-codesign --dart-define-from-file=config/staging.json
      - name: Package unsigned IPA
        run: |
          rm -rf Payload app-release-unsigned.ipa
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -r -X -q app-release-unsigned.ipa Payload
          test -f app-release-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: medibook-release-ipa-unsigned
          path: app-release-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
