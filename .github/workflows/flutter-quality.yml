name: Flutter Quality
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: dart format --output=none lib/features/triage test/features/triage lib/app/settings test/app/settings
      - run: flutter analyze --no-fatal-infos
      - run: flutter test --coverage
      - run: flutter build apk --debug

  backend:
    name: Odoo 19 Backend Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Start PostgreSQL test container
        run: |
          docker network create medibook-ci
          docker run -d --name medibook-db --network medibook-ci \
            -e POSTGRES_USER=odoo -e POSTGRES_PASSWORD=odoo -e POSTGRES_DB=postgres \
            postgres:16
          for i in {1..30}; do
            docker exec medibook-db pg_isready -U odoo -d postgres && break
            sleep 2
          done
          docker exec medibook-db pg_isready -U odoo -d postgres
      - name: Python syntax check
        run: python3 -m compileall -q addons
      - name: Odoo 19 module tests
        run: |
          docker run --rm --network medibook-ci             -v "$GITHUB_WORKSPACE/addons:/mnt/extra-addons:ro"             odoo:19.0 -c /dev/null --db_host=medibook-db --db_port=5432             --db_user=odoo --db_password=odoo             --database=medibook_feature_test             --init=medibook_api             --addons-path=/mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons             --test-enable --stop-after-init --without-demo=all --log-level=test
      - name: Cleanup PostgreSQL test container
        if: always()
        run: |
          docker rm -f medibook-db || true
          docker network rm medibook-ci || true
