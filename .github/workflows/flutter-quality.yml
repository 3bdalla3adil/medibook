name: Flutter Quality
permissions:
  contents: write
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      - name: Format Dart sources
        run: dart format lib test
      - run: flutter analyze --no-fatal-infos
      - run: flutter test --coverage
      - name: Ensure Android platform uses Flutter embedding v2
        run: flutter create --platforms=android --org com.medibook .
      - name: Build Android debug APK
        run: flutter build apk --debug


  ios:
    name: iOS Release IPA
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Select supported Xcode toolchain
        run: |
          sudo xcode-select -s /Applications/Xcode_26.4.1.app/Contents/Developer
          xcodebuild -version
      - run: flutter gen-l10n
      - name: Prepare iOS build workspace
        run: mkdir -p build/ios/SourcePackages
      - name: Generate iOS platform
        run: flutter create --platforms=ios --org com.medibook .
      - name: Build unsigned release IPA
        run: flutter build ipa --release --no-codesign
      - name: Package unsigned IPA from archive
        run: |
          rm -rf build/ios/ipa
          mkdir -p build/ios/ipa/Payload
          cp -R build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app build/ios/ipa/Payload/Medibook.app
          cd build/ios/ipa
          /usr/bin/zip -qry Medibook-unsigned.ipa Payload
          rm -rf Payload
      - name: Verify IPA artifact
        run: test -s build/ios/ipa/Medibook-unsigned.ipa
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: medibook-ios-unsigned-ipa
          path: build/ios/ipa/Medibook-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

  backend:
    name: Odoo 19 Backend Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Start PostgreSQL test container
        run: |
          docker network create medibook-ci
          docker run -d --name medibook-db --network medibook-ci \
            -e POSTGRES_USER=odoo -e POSTGRES_PASSWORD=odoo -e POSTGRES_DB=postgres \
            postgres:16
          for i in {1..30}; do
            docker exec medibook-db pg_isready -U odoo -d postgres && break
            sleep 2
          done
          docker exec medibook-db pg_isready -U odoo -d postgres
      - name: Python syntax check
        run: python3 -m compileall -q addons
      - name: Odoo 19 module tests
        run: |
          docker run --rm --network medibook-ci             -e HOST=medibook-db -e PORT=5432 -e USER=odoo -e PASSWORD=odoo             -v "$GITHUB_WORKSPACE/addons:/mnt/extra-addons:ro"             odoo:19.0 -c /dev/null --db_host=medibook-db --db_port=5432             --db_user=odoo --db_password=odoo             --database=medibook_feature_test             --init=medibook_api             --addons-path=/mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons             --test-tags /medibook_api --stop-after-init --without-demo=all --log-level=test
      - name: Cleanup PostgreSQL test container
        if: always()
        run: |
          docker rm -f medibook-db || true
          docker network rm medibook-ci || true
